  <title
     id="title1">Afterglow</title>
  <!-- 16px, and nothing here is a scaled-down anything.
       At this size the knot is impossible - its crossing would need a gap smaller than
       one pixel - so the centre is an OPEN RING, which keeps a hole and a break and is
       the most of the squiggle that survives. The break is at the BOTTOM and narrow: a
       wide gap facing right reads as the letter C, which is worse than an abstract
       shape, and that is what the first attempt looked like.
       The four orthogonal rays are rectangles on whole-pixel boundaries so they render
       dead crisp. The four diagonals cannot be aligned to the grid at all, so they are
       dots: a dot stays a dot when antialiased, where a diagonal bar becomes a smear. -->
  <rect
     x="7"
     y="1"
     width="2"
     height="3"
     fill="#E0611D"
     id="rect1" />
