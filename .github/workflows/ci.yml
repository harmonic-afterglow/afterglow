name: CI

# The ignore list is derived from what the suite actually reads, not from file type.
# Most documentation is inert, but some is not: `tests/test_docs.py` asserts the format
# documents exist, that every `docs/*.md` citation in the package resolves, and that the
# README still shows the mark; `test_platform_support.py` reads `pyproject.toml`. So
# `README.md`, `docs/`, `assets/` and `pyproject.toml` are NOT ignored - editing them can
# genuinely fail the build.
#
# Before adding a path here, check nothing under `tests/` reads it.
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "AGENTS.md"
      - "LICENSE"
      - ".gitignore"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "AGENTS.md"
      - "LICENSE"
      - ".gitignore"
      - "docs/**"
  workflow_dispatch:

# One run per branch. Pushing three times in a minute should test the last commit, not
# queue three full matrices; superseded runs are cancelled. `main` is exempt, because a
# push there is a state someone may need the result for.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    # Windows and macOS are here because that is what most users will run, and neither
    # has ever been tried against real hardware. Flashing needs libconcord plus a USB
    # network link that only Linux automates (linux/harmony_net.sh), so the hardware
    # half cannot be covered here on any platform - those tests skip without a remote.
    #
    # Everything else - the container format, the builder, importing, the portable IR
    # layer, the GUI - is pure standard library plus Qt and should be portable. "Should
    # be" is the reason to run it: this matrix already has to catch things like the user
    # data directory resolving to a Unix dotfile path on Windows.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 3.11 is the declared floor and is not optional to test. A module once
        # annotated a parameter with a name it never imported; that only ran on 3.14,
        # where PEP 649 made annotations lazy, and raised NameError on import for
        # everyone on 3.11 or 3.12. A single-version matrix would not have caught it.
        python-version: ["3.11", "3.12", "3.13"]
        exclude:
          # Keep the non-Linux legs to the declared floor and the newest supported
          # version; the middle one adds cost without adding coverage.
          - {os: windows-latest, python-version: "3.12"}
          - {os: macos-latest, python-version: "3.12"}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # PyQt6 needs the platform libraries even to import. Only Linux runners lack them.
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
                                  libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
                                  libxcb-shape0 libxcb-xinerama0

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev,gui]"

      # Real-config tests skip when their private fixtures are absent, which is the
      # normal state here: no configuration, dump or firmware image is ever committed.
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # From the dev extra, so the gate CI runs is the gate a contributor gets.
      - run: pip install -e '.[dev]'
      # The gate is correctness (pyflakes), not house style; see [tool.ruff] in
      # pyproject.toml for why the E-series style rules are deliberately off.
      - run: ruff check .

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install build && python -m build
      # The library, firmware artwork and build scaffold are not optional extras:
      # without them there is no device to pick and nothing to build onto.
      - name: The distribution must carry its package data
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(wheel).namelist()
          required = (
              "afterglow/library/remotes/harmony-900.json",
              "afterglow/linux/harmony_net.sh",
              "afterglow/backends/harmony_pk/native_registry.py",
              "afterglow/scaffolds/harmony-900/.ezhex_order",
              "afterglow/scaffolds/harmony-900/.preinstall",
              "afterglow/scaffolds/harmony-900/.postinstall",
              "afterglow/scaffolds/harmony-900/.version",
          )
          missing = [name for name in required if name not in names]
          assert not missing, f"critical package data missing from {wheel}: {missing}"
          # No protocol definitions ship, of either kind. Every protocol comes from the
          # IrProto blocks of the configuration being imported, or is generated from an
          # archive record. This used to require twelve portable ones *and* forbid
          # anything at that path, which became a contradiction the moment the library
          # was emptied - the two checks were written years apart and never read together.
          protocols = [name for name in names
                       if name.endswith(".json")
                       and ("/library/protocols/" in name
                            or "/backends/harmony_pk/protocols/" in name)]
          assert not protocols, f"protocol definitions leaked into wheel: {protocols}"
          print(f"{wheel}: {len(names)} entries, package data present")
          PY
